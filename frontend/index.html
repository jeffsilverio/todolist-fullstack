<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete%2Cedit" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <title>Lista de Tarefas</title>
</head>
<body>

    <main>

        <form class="add-form">
            <input type="text" placeholder="Adicionar tarefa" class="input-task">
            <button type="submit">+</button>
        </form>

        <table>

            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Criada em</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
        
            <tbody>
                <tr>
                    <td>Título da tarefa</td>
                    <td>00 de janeiro de 2026 10:00</td>
                    <td>
                        <select>
                            <option value="pendente">Pendente</option>
                            <option value="em andamento">Em andamento</option>
                            <option value="concluida">Concluída</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-action">
                            <span class="material-symbols-outlined">edit</span>
                        </button>

                        <button class="btn-action">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </td>
                </tr>
            </tbody>

        </table>

    </main>

    <script src="./js/script.js"> </script>
</body>
</html>
